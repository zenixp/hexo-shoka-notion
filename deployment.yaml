# 使用 traefik ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hexo-blog-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: blog.zenixp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hexo-blog-service
                port:
                  number: 80
