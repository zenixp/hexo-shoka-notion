apiVersion: apps/v1
kind: Deployment
metadata:
  name: hexo-blog
  labels:
    app: hexo-blog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hexo-blog
  template:
    metadata:
      labels:
        app: hexo-blog
    spec:
      containers:
      - name: hexo-blog
        image: hexo-blog:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        # 健康检查
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hexo-blog-service
spec:
  selector:
    app: hexo-blog
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
